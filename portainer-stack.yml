# Portainer Stack — AutoParseAlertBot
# Код и данные: /opt/autoparsealertbot
#
# Сборка образа:
#   cd /opt/autoparsealertbot && docker build -t autoparsealertbot:latest .
#
# Portainer → Stacks → Add stack → Web editor
# Environment variables стека — скопируйте из portainer.env.example (значения с сервера)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /opt/autoparsealertbot/redis:/data
    networks:
      - apa_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  bot:
    image: autoparsealertbot:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - /opt/autoparsealertbot/data:/app/data
      - /opt/autoparsealertbot/accounts:/app/accounts
      - /opt/autoparsealertbot/logs:/app/logs
    networks:
      - apa_net
    environment:
      # Telegram
      BOT_TOKEN: ${BOT_TOKEN}
      ID: ${ID}
      HASH: ${HASH}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}

      # Доступ
      CLOSED_BETA: ${CLOSED_BETA:-true}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      DEVELOPER_USERNAME: ${DEVELOPER_USERNAME:-cheef_engineer}

      # AI
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      POLZA_AI_API_KEY: ${POLZA_AI_API_KEY:-}

      # Proxy
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      PROXY_IP: ${PROXY_IP:-}
      PROXY_PORT: ${PROXY_PORT:-}

      # Web
      PORT: "8000"
      WEBAPP_URL: ${WEBAPP_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # Режим бота
      BOT_MODE: ${BOT_MODE:-polling}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

      # Redis (внутри стека всегда на сервис redis)
      REDIS_URL: redis://redis:6379/0

      # Dev
      ENABLE_MOCK_AUTH: ${ENABLE_MOCK_AUTH:-false}

      # Логи / TZ
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: logs/bot.log
      LOG_DIR: logs
      LOG_COLORS: ${LOG_COLORS:-false}
      LOG_ROTATION_ENABLED: ${LOG_ROTATION_ENABLED:-false}
      TIMEZONE: ${TIMEZONE:-UTC}
      TZ: ${TIMEZONE:-UTC}

networks:
  apa_net:
    driver: bridge
